<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>دفتر واریزی‌ها و هزینه‌ها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر واریزی‌ها">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0B;
    --panel: #16140F;
    --panel-2: #1D1A13;
    --border: #332C1B;
    --border-soft: #262117;
    --text: #F3ECDA;
    --muted: #9C9280;
    --gold: #6C63FF;
    --gold-2: #9D8BFF;
    --gold-dim: rgba(108,99,255,0.14);
    --gold-dim-2: rgba(108,99,255,0.28);
    --gold-panel: #14121F;
    --gold-panel-2: #1A1729;
    --gold-border: #2E2A48;
    --gold-border-soft: #211E36;

    --exp: #14B8A6;
    --exp-2: #5EEAD4;
    --exp-dim: rgba(20,184,166,0.14);
    --exp-dim-2: rgba(20,184,166,0.28);
    --exp-panel: #0C1B1A;
    --exp-panel-2: #10231F;
    --exp-border: #1E3D38;
    --exp-border-soft: #162B27;

    --red: #E5595E;
    --red-dim: rgba(229,89,94,0.15);
    --green: #6FBF73;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background: radial-gradient(1200px 600px at 20% -10%, #1c1608 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Vazirmatn', Tahoma, "Segoe UI", Arial, sans-serif;
    direction:rtl;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:22px 12px 60px;}

  .header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:0 6px;}
  .header .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);flex-shrink:0;}
  .header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px;}
  .header span{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;}

  .total-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--border-soft);border-radius:16px;padding:18px;
    text-align:center;margin-bottom:12px;position:relative;overflow:hidden;
  }
  .total-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),var(--exp));}
  .total-card .label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .total-card .value{font-size:27px;font-weight:800;color:var(--gold);direction:ltr;unicode-bidi:plaintext;}
  .total-card .value.neg{color:var(--red);}
  .total-card .breakdown{display:flex;justify-content:center;gap:18px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-soft);}
  .breakdown .bitem{text-align:center;}
  .breakdown .bitem .blabel{font-size:10.5px;color:var(--muted);margin-bottom:3px;}
  .breakdown .bitem .bval{font-size:14px;font-weight:800;direction:ltr;unicode-bidi:plaintext;}
  .breakdown .bitem.dep .bval{color:var(--gold-2);}
  .breakdown .bitem.exp .bval{color:var(--exp-2);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 6px 8px;}
  .section-title h2{font-size:13.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:6px;}
  .section-title .badge{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .section-title.dep .badge{background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .section-title.exp .badge{background:var(--exp);box-shadow:0 0 8px var(--exp);}
  .section-title .count{color:var(--muted);font-size:11px;font-weight:600;}

  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    border:none;padding:11px 16px;border-radius:12px;
    font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
    width:100%;margin-bottom:14px;
  }
  .add-btn.dep{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#100C28;box-shadow:0 6px 18px rgba(108,99,255,.28);}
  .add-btn.exp{background:linear-gradient(135deg,var(--exp-2),var(--exp));color:#052220;box-shadow:0 6px 18px rgba(20,184,166,.28);}
  .add-btn:active{transform:translateY(1px);}

  .entries-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:6px;
  }

  .entry-card{
    background:linear-gradient(160deg,var(--gold-panel),var(--gold-panel-2));
    border:1px solid var(--gold-border);border-radius:12px;padding:8px;
    position:relative;transition:padding .18s ease;
  }
  .entry-card.exp-card{
    background:linear-gradient(160deg,var(--exp-panel),var(--exp-panel-2));
    border:1px solid var(--exp-border);
  }

  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;}
  .tick{
    width:18px;height:18px;border-radius:6px;border:1.5px solid var(--gold-border);
    background:#0B0A12;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:transparent;transition:all .15s ease;
  }
  .exp-card .tick{border-color:var(--exp-border);background:#081513;}
  .tick.on{color:#0A0A0B;}
  .entry-card:not(.exp-card) .tick.on{background:var(--gold);border-color:var(--gold);color:#0F0B24;}
  .exp-card .tick.on{background:var(--exp);border-color:var(--exp);color:#052220;}

  .del-btn{
    background:transparent;border:none;color:var(--red);
    cursor:pointer;font-size:14px;font-weight:800;line-height:1;padding:2px 4px;
    opacity:.75;
  }
  .del-btn:active{opacity:1;}

  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:5px;}
  .field:last-child{margin-bottom:0;}
  .field input{
    background:#0B0A12;border:1px solid var(--gold-border);color:var(--text);
    border-radius:7px;padding:6px 7px;font-size:12px;font-family:inherit;font-weight:600;
    width:100%;text-align:right;min-width:0;
  }
  .exp-card .field input{background:#081513;border-color:var(--exp-border);}
  .field input:focus{outline:none;border-color:var(--gold);}
  .exp-card .field input:focus{border-color:var(--exp);}
  .field.amount input{color:var(--gold-2);font-weight:800;direction:rtl;font-size:13px;}
  .exp-card .field.amount input{color:var(--exp-2);}
  .field input::placeholder{color:var(--muted);font-weight:400;font-size:11px;}

  /* Collapsed / done state */
  .entry-card.done{padding:8px 9px;}
  .entry-card.done .field{display:none;}
  .entry-card.done .card-top{margin-bottom:0;}
  .done-summary{display:none;}
  .entry-card.done .done-summary{
    display:flex;flex-direction:column;gap:2px;padding:2px 0 1px;
  }
  .done-summary .ds-amount{font-size:13px;font-weight:800;color:var(--gold-2);direction:ltr;unicode-bidi:plaintext;}
  .exp-card .done-summary .ds-amount{color:var(--exp-2);}
  .done-summary .ds-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--gold-border-soft);border-radius:12px;margin-bottom:6px;}
  .empty.exp{border-color:var(--exp-border-soft);}

  .save-indicator{
    position:fixed;bottom:18px;left:18px;background:var(--panel-2);
    border:1px solid var(--gold-dim-2);color:var(--gold-2);font-size:12px;
    padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s ease;
    pointer-events:none;font-weight:700;z-index:10;
  }
  .save-indicator.show{opacity:1;}

  @media(max-width:360px){
    .entries-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:420px){
    .wrap{padding:16px 10px 50px;}
    .total-card .value{font-size:23px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="dot"></div>
    <div>
      <h1>دفتر واریزی‌ها و هزینه‌ها</h1>
      <span>مقدار، از طرف کی / بابت چی، در چه تاریخی</span>
    </div>
  </div>

  <div class="total-card">
    <div class="label">مانده (واریزی منهای هزینه)</div>
    <div class="value" id="netAmount">0 تومان</div>
    <div class="breakdown">
      <div class="bitem dep">
        <div class="blabel">جمع واریزی</div>
        <div class="bval" id="totalDep">0</div>
      </div>
      <div class="bitem exp">
        <div class="blabel">جمع هزینه</div>
        <div class="bval" id="totalExp">0</div>
      </div>
    </div>
  </div>

  <div class="section-title dep">
    <h2><span class="badge"></span>واریزی‌ها</h2>
    <span class="count" id="depCount">۰ مورد</span>
  </div>
  <button class="add-btn dep" onclick="addEntry('dep')">+ افزودن واریزی جدید</button>
  <div class="entries-grid" id="depList"></div>
  <div class="empty" id="depEmpty" style="display:none;">هنوز واریزی‌ای ثبت نکردی.</div>

  <div class="section-title exp">
    <h2><span class="badge"></span>هزینه‌ها</h2>
    <span class="count" id="expCount">۰ مورد</span>
  </div>
  <button class="add-btn exp" onclick="addEntry('exp')">+ افزودن هزینه جدید</button>
  <div class="entries-grid" id="expList"></div>
  <div class="empty exp" id="expEmpty" style="display:none;">هنوز هزینه‌ای ثبت نکردی.</div>

</div>

<div class="save-indicator" id="saveIndicator">ذخیره شد ✓</div>

<script>
const STORAGE_DEP = 'variz-tracker-entries-v1';
const STORAGE_EXP = 'variz-tracker-expenses-v1';

let dep = [];
let exp = [];
let saveTimer = null;

function uid(){ return 'e' + Date.now() + Math.random().toString(36).slice(2,7); }

function fmtToman(n){
  n = Math.round(n || 0);
  return n.toLocaleString('en-US') + ' تومان';
}
function fmtNum(n){
  n = Math.round(n || 0);
  return n.toLocaleString('en-US');
}
function digitsToFa(str){
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(str).replace(/[0-9]/g, d => fa[d]);
}
function normalizeDigits(str){
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  const ar = '٠١٢٣٤٥٦٧٨٩';
  return String(str).replace(/[۰-۹]/g, d => fa.indexOf(d)).replace(/[٠-٩]/g, d => ar.indexOf(d));
}
function formatAmountInput(raw){
  const digits = normalizeDigits(raw).replace(/[^\d]/g, '');
  if(!digits) return '';
  return Number(digits).toLocaleString('en-US');
}
function parseAmount(raw){
  const digits = normalizeDigits(raw).replace(/[^\d]/g, '');
  return digits ? Number(digits) : 0;
}

function getStore(kind){ return kind === 'dep' ? dep : exp; }
function setStore(kind, arr){ if(kind === 'dep') dep = arr; else exp = arr; }
function storageKey(kind){ return kind === 'dep' ? STORAGE_DEP : STORAGE_EXP; }

function loadData(){
  try{
    const rawDep = localStorage.getItem(STORAGE_DEP);
    if(rawDep) dep = JSON.parse(rawDep);
  }catch(e){ dep = []; }
  if(!Array.isArray(dep)) dep = [];
  dep.forEach(en => {
    if(en.amount === undefined) en.amount = 0;
    if(en.from === undefined) en.from = '';
    if(en.date === undefined) en.date = '';
    if(en.done === undefined) en.done = false;
  });

  try{
    const rawExp = localStorage.getItem(STORAGE_EXP);
    if(rawExp) exp = JSON.parse(rawExp);
  }catch(e){ exp = []; }
  if(!Array.isArray(exp)) exp = [];
  exp.forEach(en => {
    if(en.amount === undefined) en.amount = 0;
    if(en.from === undefined) en.from = '';
    if(en.date === undefined) en.date = '';
    if(en.done === undefined) en.done = false;
  });

  render();
}

function saveData(kind){
  try{
    localStorage.setItem(storageKey(kind), JSON.stringify(getStore(kind)));
    const ind = document.getElementById('saveIndicator');
    ind.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> ind.classList.remove('show'), 1200);
  }catch(e){
    console.error('storage error', e);
  }
}

function addEntry(kind){
  getStore(kind).unshift({id: uid(), amount: 0, from: '', date: '', done: false});
  render();
  saveData(kind);
}

function removeEntry(kind, id){
  setStore(kind, getStore(kind).filter(en => en.id !== id));
  render();
  saveData(kind);
}

function updateEntryField(kind, id, field, value){
  const en = getStore(kind).find(en => en.id === id);
  if(!en) return;
  if(field === 'amount'){
    en.amount = parseAmount(value);
  }else if(field === 'from'){
    en.from = value;
  }else if(field === 'date'){
    en.date = value;
  }
  render();
  saveData(kind);
}

function toggleDone(kind, id){
  const en = getStore(kind).find(en => en.id === id);
  if(!en) return;
  en.done = !en.done;
  render();
  saveData(kind);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderList(kind){
  const listId = kind === 'dep' ? 'depList' : 'expList';
  const emptyId = kind === 'dep' ? 'depEmpty' : 'expEmpty';
  const countId = kind === 'dep' ? 'depCount' : 'expCount';
  const fromPlaceholder = kind === 'dep' ? 'نام' : 'بابت چی';
  const items = getStore(kind);

  const list = document.getElementById(listId);
  const emptyMsg = document.getElementById(emptyId);
  list.innerHTML = '';
  emptyMsg.style.display = items.length === 0 ? 'block' : 'none';
  document.getElementById(countId).textContent = digitsToFa(items.length) + ' مورد';

  let total = 0;

  items.forEach(en => {
    total += (en.amount || 0);

    const card = document.createElement('div');
    card.className = 'entry-card' + (kind === 'exp' ? ' exp-card' : '') + (en.done ? ' done' : '');
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="tick' + (en.done ? ' on' : '') + '" data-role="tick">' + (en.done ? '✓' : '') + '</div>' +
        '<button class="del-btn" type="button" data-role="del">×</button>' +
      '</div>' +
      '<div class="done-summary">' +
        '<span class="ds-amount">' + fmtNum(en.amount) + '</span>' +
        '<span class="ds-sub">' + escapeHtml(en.from || fromPlaceholder) + (en.date ? ' · ' + escapeHtml(en.date) : '') + '</span>' +
      '</div>' +
      '<div class="field amount">' +
        '<input type="text" inputmode="numeric" placeholder="مبلغ" value="' + (en.amount ? fmtNum(en.amount) : '') + '" data-field="amount">' +
      '</div>' +
      '<div class="field">' +
        '<input type="text" placeholder="' + fromPlaceholder + '" value="' + escapeHtml(en.from) + '" data-field="from">' +
      '</div>' +
      '<div class="field">' +
        '<input type="text" placeholder="تاریخ" value="' + escapeHtml(en.date) + '" data-field="date">' +
      '</div>';

    const amountInput = card.querySelector('[data-field="amount"]');
    amountInput.addEventListener('input', (e) => {
      e.target.value = formatAmountInput(e.target.value);
    });
    amountInput.addEventListener('change', (e) => updateEntryField(kind, en.id, 'amount', e.target.value));
    card.querySelector('[data-field="from"]').addEventListener('change', (e) => updateEntryField(kind, en.id, 'from', e.target.value));
    card.querySelector('[data-field="date"]').addEventListener('change', (e) => updateEntryField(kind, en.id, 'date', e.target.value));
    card.querySelector('[data-role="tick"]').addEventListener('click', () => toggleDone(kind, en.id));
    card.querySelector('[data-role="del"]').addEventListener('click', () => removeEntry(kind, en.id));

    list.appendChild(card);
  });

  return total;
}

function render(){
  const totalDep = renderList('dep');
  const totalExp = renderList('exp');
  const net = totalDep - totalExp;

  document.getElementById('totalDep').textContent = fmtNum(totalDep);
  document.getElementById('totalExp').textContent = fmtNum(totalExp);

  const netEl = document.getElementById('netAmount');
  netEl.textContent = fmtToman(net);
  netEl.classList.toggle('neg', net < 0);
}

loadData();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>

</body></html>
